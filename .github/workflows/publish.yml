name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every optional feature is compiled on every push. The `gpu` feature once
  # rotted into a non-compiling state precisely because CI only ever built
  # `--features python`; this matrix is what prevents that from recurring.
  features:
    name: Build (${{ matrix.feature.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - { name: "default", flags: "" }
          - { name: "python", flags: "--features python" }
          - { name: "gpu", flags: "--features gpu" }
          - { name: "all-features", flags: "--all-features" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check (lib, bins, tests, benches)
        run: cargo check --all-targets ${{ matrix.feature.flags }}

  lint:
    name: Lint (clippy + rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Allowed lints are declared in Cargo.toml `[lints.clippy]` with a written
      # rationale, so anything reaching this gate is genuinely unreviewed.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  test:
    name: Test (cargo + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo tests
        run: cargo test --features python

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Build and install extension (develop mode)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
          maturin develop --release --features python

      - name: Run validation suite
        run: |
          source .venv/bin/activate
          python -m pytest validation/ -q

      # The examples are user-facing documentation. If they break, the first
      # thing a new user runs is broken, so they are tested like any other code.
      - name: Run examples
        env:
          MPLBACKEND: Agg
        run: |
          source .venv/bin/activate
          for f in examples/*.py; do
            echo "--- $f"
            python "$f" || exit 1
          done

  linux:
    name: Build wheels (Linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [features, lint, test]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features python
          sccache: "true"
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    name: Build wheels (Windows ${{ matrix.target }})
    runs-on: windows-latest
    needs: [features, lint, test]
    strategy:
      matrix:
        target: [x64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features python
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: Build wheels (macOS ${{ matrix.target }})
    runs-on: macos-latest
    needs: [features, lint, test]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features python
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [features, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, sdist]
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (no API token needed).
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
